name: Build APK

# Запускается вручную: вкладка Actions -> Build APK -> Run workflow
on: workflow_dispatch

jobs:
  build-android:
    name: Build for Android
    # Версия закреплена, чтобы сборка не ломалась, когда GitHub меняет "ubuntu-latest"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "Cython<3.0" "setuptools<71" buildozer

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wall-climbers-apk
          path: bin/*.apk
