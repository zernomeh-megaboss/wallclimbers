name: Build APK

# Запускается вручную: вкладка Actions -> Build APK -> Run workflow
on: workflow_dispatch

jobs:
  build-android:
    name: Build for Android
    # Версия закреплена, чтобы сборка не ломалась, когда GitHub меняет "ubuntu-latest"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "Cython<3.0" "setuptools<71" buildozer

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      # Если сборка упала — показываем конец лога прямо на странице запуска (раздел Summary)
      - name: Show end of the log on failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Конец лога сборки — скопируй и пришли"
            echo '```'
            tail -n 70 build.log 2>/dev/null || echo "build.log не создан: сбой случился раньше шага сборки"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wall-climbers-apk
          path: bin/*.apk
